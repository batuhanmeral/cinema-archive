version: 2

# Haftalık toplu PR'lar. cooldown, bir haftadan yeni sürümleri atlar: ele geçirilmiş
# bir sürümün geri çekilmesine zaman tanır. Security updates bundan etkilenmez.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope # "ci(deps): ..."
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm # npm, pnpm ve yarn'ı kapsar
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope # "chore(deps): ...", "chore(deps-dev): ..."
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Majors need code changes; take them by hand. Security updates still open PRs.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
